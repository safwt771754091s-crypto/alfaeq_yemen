name: Run Firebase Seed

on:
  workflow_dispatch:

jobs:
  run-seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install deps
        run: npm install firebase-admin

      - name: Run seed script
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ] || [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "Set FIREBASE_SERVICE_ACCOUNT_JSON and FIREBASE_PROJECT_ID in repo secrets.";
            exit 1;
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" | base64 --decode > /tmp/serviceAccount.json
          node scripts/firebase_seed.js --serviceAccount=/tmp/serviceAccount.json --projectId=$FIREBASE_PROJECT_ID
