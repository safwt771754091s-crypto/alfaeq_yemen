name: Build Flutter APK

on:
  push:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Debug Project Structure
        run: |
          echo "=== Displaying Repository Structure ==="
          find . -maxdepth 3 -not -path '*/.*'

      - name: Build APK
        run: |
          # البحث المباشر عن أي ملف ينتهي بـ main.dart
          TARGET_MAIN=$(find . -name "main.dart" | head -n 1)
          
          if [ -z "$TARGET_MAIN" ]; then
            echo "Error: main.dart was not pushed to GitHub repository!"
            exit 1
          fi
          
          PROJ_ROOT=$(dirname $(dirname "$TARGET_MAIN"))
          cd "$PROJ_ROOT"
          
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alfaeq_yemen_app
          path: '**/build/app/outputs/flutter-apk/*.apk'
