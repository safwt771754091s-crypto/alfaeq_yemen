  // PROVINCE SELECTOR DIALOG
  void _showProvincePicker() {
    showModalBottomSheet(
      context: context,
      shape: const RoundedRectangleBorder(
        borderRadius: BorderRadius.vertical(top: Radius.circular(20)),
      ),
      builder: (context) => Container(
        padding: const EdgeInsets.all(16),
        child: Column(
          mainAxisSize: MainAxisSize.min,
          children: _provinces
              .map((p) => ListTile(
                    title: Text(p, style: const TextStyle(fontWeight: FontWeight.bold)),
                    trailing: _selectedProvince == p ? const Icon(Icons.check_circle_rounded, color: Color(0xFF0F52BA)) : null,
                    onTap: () {
                      setState(() => _selectedProvince = p);
                      Navigator.pop(context);
                    },
                  ))
              .toList(),
        ),
      ),
    );
  }

  // PLACEHOLDER FOR OTHER NAV TABS
  Widget _buildPlaceholderPage(String title, IconData icon) {
    return Center(
      child: Column(
        mainAxisAlignment: MainAxisAlignment.center,
        children: [
          Icon(icon, size: 60, color: const Color(0xFF0F52BA)),
          const SizedBox(height: 12),
          Text(title, style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
