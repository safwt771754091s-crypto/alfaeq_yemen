          _buildHeader(),
          const SizedBox(height: 16),
          _buildOffersSlider(),
          const SizedBox(height: 20),
          _buildCategoryGrid(),
          const SizedBox(height: 24),
          _buildFeaturedStores(),
          const SizedBox(height: 24),
          _buildLatestOffers(),
          const SizedBox(height: 24),
