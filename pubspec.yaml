  firebase_crashlytics: ^3.0.11

dev_dependencies:
  geolocator: ^12.0.0
  firebase_storage: ^12.0.1
  cloud_firestore: ^5.0.1
  firebase_auth: ^5.1.0
  flutter_map: ^6.1.0
